name: Fotografia licenciada dos jogadores

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_portraits.py'
      - '.github/workflows/portraits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portraits:
    name: Obter imagens reutilizaveis
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteca de imagem
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Sincronizar retratos com creditos
        run: python scripts/fetch_portraits.py
      - name: Publicar somente fotos e creditos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portraits/ docs/PHOTO_CREDITS.md
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add licensed football portraits with attribution'
            git push origin HEAD:main
          fi
