name: Gerar cartas premium Futstancy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_cards.py'
      - 'src/catalog.ts'
      - '.github/workflows/cards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futstancy-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Criar cartas com retratos reais e dados do catálogo
        run: python scripts/render_cards.py
      - name: Publicar os arquivos JPG no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cards/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish premium cards for all 44 footballers'
            git push origin HEAD:main
          fi
